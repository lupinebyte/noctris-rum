name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  handle_failure:
    name: Handle failure of any job
    needs: [check]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Failure handler
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58
        env:
          SLACK_CHANNEL: dev-builds
          SLACK_WEBHOOK: ${{ secrets.DEV_BUILDS_SLACK_WEBHOOK }}
          SLACK_TITLE: "BUILD FAILURE: Noctris RUM"
          SLACK_COLOR: danger
